apiVersion: apps/v1
kind: Deployment
metadata:
  name: a2a-hil-approval
  namespace: your-sam-namespace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: a2a-hil-approval
  template:
    metadata:
      labels:
        app: a2a-hil-approval
    spec:
      containers:
        - name: agent
          image: your-registry/a2a-hil-approval:1.0.0
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ANTHROPIC_BASE_URL
              value: https://api.anthropic.com
            - name: ANTHROPIC_MODEL
              value: claude-opus-5
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: a2a-hil-approval-llm
                  key: api-key
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: a2a-hil-approval
  namespace: your-sam-namespace
spec:
  selector:
    app: a2a-hil-approval
  ports:
    - name: http
      port: 80
      targetPort: http
